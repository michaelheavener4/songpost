<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | SONGPOST</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101116;color:#f2f3f7}body{margin:0}main{max-width:760px;margin:8vh auto;padding:0 6vw}h1{font-size:clamp(2rem,6vw,3.5rem)}p,li{line-height:1.7;color:#b9bfd0;overflow-wrap:anywhere}a{color:#c0a1ff}audio{width:100%;margin:1rem 0}form{display:flex;gap:.75rem;margin:1.5rem 0}input,button{font:inherit;padding:1rem;border-radius:10px}input{flex:1;min-width:0;background:#1b1e28;color:white;border:1px solid #41465a}button{background:#c0a1ff;border:0;color:#171020;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #d7c3ff;outline-offset:3px}#status{min-height:1.7em}@media(max-width:600px){form{flex-direction:column}}
</style>
</head>
<body><main data-slug="{{SLUG}}">
<a href="/">SONGPOST</a>
<h1>{{TITLE}}</h1>
<p>{{PROMPT}}</p>
<audio controls preload="metadata" src="{{AUDIO_SRC}}">Your browser does not support audio playback. <a href="{{AUDIO_SRC}}">Download the song</a>.</audio>
<h2>Shape the next version</h2>
<form id="feedback"><input id="text" aria-label="Feedback for the next version" placeholder="darker, more drums, more bass" maxlength="4000" required><button>Make a new version</button></form>
<p id="status" role="status" aria-live="polite"></p>
<h2>Versions</h2><ul>{{VERSIONS}}</ul>
<p><a href="/">Make your own</a></p>
</main>
<script>
const slug = document.querySelector('main').dataset.slug;
document.querySelector('audio').addEventListener('play', () => {
  fetch('/api/play', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug}), keepalive:true}).catch(() => {});
}, {once:true});
const form = document.querySelector('#feedback');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  const status = document.querySelector('#status');
  button.disabled = true;
  status.textContent = 'Composing the next version...';
  try {
    const response = await fetch('/api/feedback', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({slug, text:document.querySelector('#text').value})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Could not make a new version.');
    window.location.reload();
  } catch (error) {status.textContent = error.message; button.disabled = false;}
});
</script>
</body></html>
